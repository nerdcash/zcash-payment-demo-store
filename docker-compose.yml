# Runs the sample store beside zcash-payment-service.
# Copy .env.example to .env and set ZCASH_UIVK plus ZCASH_BIRTHDAY_HEIGHT
# before `docker compose up`. The payment container will not become healthy
# until those are real. Do not commit a real viewing key.

services:
  zcash-payment-service:
    image: ghcr.io/nerdcash/zcash-payment-service:main
    environment:
      PORT: "8787"
      APP_DATA_DIR: /data/zcash-payment
      ZCASH_NETWORK: ${ZCASH_NETWORK:-testnet}
      ZCASH_UIVK: ${ZCASH_UIVK:-}
      ZCASH_BIRTHDAY_HEIGHT: ${ZCASH_BIRTHDAY_HEIGHT:-}
      LIGHTWALLETD_URL: ${LIGHTWALLETD_URL:-https://testnet.lightwalletd.com:9067}
      ZCASH_WEBHOOK_URL: http://store:3000/webhooks/zcash-payments
      ZCASH_WEBHOOK_SECRET: ${ZCASH_WEBHOOK_SECRET:-replace-with-a-long-random-string}
    volumes:
      - zcash-payment-data:/data/zcash-payment
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  store:
    build: .
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/store.db
      ZCASH_PAYMENT_SERVICE_BASE_URL: http://zcash-payment-service:8787
      ZCASH_WEBHOOK_SECRET: ${ZCASH_WEBHOOK_SECRET:-replace-with-a-long-random-string}
    volumes:
      - store-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      zcash-payment-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zcash-payment-data:
  store-data:
